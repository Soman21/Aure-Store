<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auré - Women's Collection</title>
  <link href="./output.css" rel="stylesheet">
</head>

<body class="bg-gray-50">

  <!-- NAVBAR -->
  <header class="flex justify-between items-center p-4 bg-white shadow-sm">
    <h1 class="text-xl font-bold">Auré</h1>

    <div 
      id="cart-btn"
      class="relative cursor-pointer hover:opacity-70 transition">
      🛒
      <span 
        id="cart-count"
        class="absolute -top-2 -right-2 bg-black text-white text-xs rounded-full px-2 min-w-[20px] text-center">
        0
      </span>
    </div>
  </header>

  <!-- PAGE TITLE -->
  <section class="p-4">
    <h2 class="text-2xl font-semibold">Women's Collection</h2>
    <p class="text-gray-500 text-sm">Discover premium active wear</p>
  </section>

  <!-- PRODUCT GRID -->
  <main class="max-w-7xl mx-auto p-4">
    <div id="product-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 p-4">
      <!-- Products render here -->
       
    </div>
  </main>

  <!-- CART SIDEBAR -->
  <aside 
    id="cart" 
    class="hidden fixed top-0 right-0 h-full bg-white shadow-2xl z-50
           w-full sm:w-96 md:w-[420px] lg:w-[450px]
           flex flex-col">
    
    <!-- FIXED HEADER -->
    <div class="flex justify-between items-center p-5 border-b shrink-0">
      <div>
        <h2 class="text-lg font-semibold">Your Cart</h2>
        <p id="cart-summary" class="text-xs text-gray-500 mt-0.5">0 items</p>
      </div>
      <button 
        id="close-cart" 
        class="text-3xl text-gray-400 hover:text-gray-600 transition leading-none">
        ×
      </button>
    </div>

    <!-- SCROLLABLE CONTENT -->
    <div 
      id="cart-items"
      class="flex-1 overflow-y-auto p-5">
      <!-- Cart items render here -->
    </div>

    <!-- FIXED FOOTER (Checkout) -->
    <div class="border-t p-5 shrink-0 bg-gray-50">
      <div class="flex justify-between mb-3">
        <span class="font-medium">Subtotal</span>
        <span id="cart-total" class="font-semibold text-lg">$0.00</span>
      </div>
      <button class="w-full bg-black text-white py-3 rounded-lg font-medium hover:bg-gray-800 transition">
        Checkout
      </button>
    </div>
  </aside>

  <script src="../script.js"></script>
</body>
</html>
